version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hospital-frontend-ui
    ports:
      - "3000:80"
    restart: unless-stopped
    # If the backend is running locally on port 9191 outside of Docker, this helps the container reach it:
    extra_hosts:
      - "api-gateway:host-gateway"
