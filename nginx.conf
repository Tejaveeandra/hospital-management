server {
    listen 80;
    server_name localhost;

    # Use Docker built-in DNS server for dynamic resolution
    resolver 127.0.0.11 valid=10s;
    set $gateway https://api-gateway:9191;

    # Serve the React app for all frontend routes
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy all backend API calls to the API Gateway container (api-gateway:9191)
    location /users {
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /patients {
        proxy_pass $gateway;
